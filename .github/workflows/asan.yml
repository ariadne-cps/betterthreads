name: AddressSanitizer

on:
  pull_request:

jobs:
  test-workload:
    name: macOS AddressSanitizer test_workload
    runs-on: macos-15

    steps:
    - uses: actions/checkout@v3
      with:
        submodules: recursive

    - name: Set Up Dependencies
      run: brew install ninja pkg-config

    - name: Configure
      run: |
        cmake -S . -B build -G Ninja \
          -DCMAKE_BUILD_TYPE=Debug \
          -DCMAKE_CXX_COMPILER=/usr/bin/clang++ \
          -DCMAKE_CXX_FLAGS="-fsanitize=address -fno-omit-frame-pointer -g" \
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address"

    - name: Build test_workload
      run: cmake --build build --target test_workload --parallel 3

    - name: Run test_workload
      env:
        ASAN_OPTIONS: abort_on_error=1:halt_on_error=1:detect_leaks=0:symbolize=1
      run: ./build/test/test_workload
